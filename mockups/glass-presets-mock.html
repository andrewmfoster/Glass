<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLASS preset bank: three versions</title>
<style>
  html, body { margin: 0; background: #141518; color: #9aa0a8; font: 12px/1.45 "Helvetica Neue", Arial, sans-serif; }
  main { padding: 28px 32px 64px; width: 1410px; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #c9ced6; margin: 34px 0 3px; }
  h2:first-child { margin-top: 0; margin-bottom: 10px; }
  .tag { color: #9aa0a8; margin: 14px 0 0; max-width: 980px; font-size: 13px; }
  canvas { display: block; }
  #zoom { width: 1410px; height: 340px; }
  #actual { width: 705px; height: 170px; margin-top: 10px; }
  .pick { display: flex; align-items: center; gap: 6px; margin: 12px 0 0; }
  .pick span { width: 112px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #c9ced6; }
  .pick button { font: 600 11px/1 "Helvetica Neue", Arial, sans-serif; color: #9aa0a8; background: #1c1e23; border: 1px solid #2c2f36; border-radius: 4px; padding: 7px 11px; cursor: pointer; }
  .pick button.on { color: #fff; background: #2b2e36; border-color: #6b7280; }
</style>
</head>
<body>
<main>
  <h2>Preset bank</h2>
  <canvas id="zoom" width="1410" height="340"></canvas>
  <div class="pick" id="pickV"><span>Version</span></div>
  <div class="pick" id="pickSaved"><span>Saved presets</span></div>
  <p class="tag" id="cap"></p>
  <h2>Actual size in Live</h2>
  <canvas id="actual" width="1410" height="340"></canvas>
</main>

<script>
// The face is glass-face-blackout.html's picked one (Flat cap, Neon button, top-edge light).
// Same rule as that file: nothing here goes past what the jsui can do at runtime.
//   BAKED (drawn once offline, blur allowed, shipped as PNG): wordmark, neon button, knob cap.
//   LIVE (plain strokes, fills and gradients, no blur, no additive blending): everything else,
//   the preset list included. The name field stands in for a Max text box laid over the jsui.
// Baked blur goes through a canvas shadow, not ctx.filter, so Safari draws it too.
const W = 705, H = 170, S = 2, PW = W * S, PH = H * S;

function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const WHITE = [255, 255, 255];
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
}
function radial(g, x, y, rad, stops) {
  const gr = g.createRadialGradient(x, y, 0, x, y, rad);
  for (const [t, c, a] of stops) gr.addColorStop(t, rgba(c, a));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
}
function fade(g, x0, y0, x1, y1, stops, lw) {            // a stroke whose alpha runs along its length
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  for (const [t, c, a] of stops) gr.addColorStop(t, rgba(c, a));
  g.strokeStyle = gr; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
}
function arc(g, cx, cy, r, a0, a1, w, style, cap) { g.strokeStyle = style; g.lineWidth = w; g.lineCap = cap || 'butt'; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke(); }
function text(g, s, x, y, font, fill, ls) {
  g.font = font; g.letterSpacing = ls + 'px'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = fill;
  g.fillText(s, x + ls / 2, y);
}
// A blurred, single-colour copy of src's shape. blur is a Gaussian sigma in canvas pixels.
function softImg(g, src, blur, a, color) {
  const off = src.width + 400;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a;
  g.shadowColor = color; g.shadowBlur = blur * 2; g.shadowOffsetX = off; g.drawImage(src, -off, 0);
  g.restore();
}

// ---------- the plate: what one SHATTER makes ----------
const BR = 96;
function burstGeo(r, col, pick) {
  const b = { col, rays: [], wedges: [], spikeA: r() * Math.PI }, dirs = [];
  for (let k = 4 + (r() * 4 | 0); k--;) dirs.push(r() * 7);   // most rays gather into a few sprays, as on the icon
  for (let k = 4 + (r() * 4 | 0); k--;) b.wedges.push({ a: r() * 7, da: .05 + r() * .2, len: 38 + r() * 54, col: pick() });
  for (let k = 150; k--;) b.rays.push({ a: r() < .74 ? dirs[(r() * dirs.length) | 0] + (r() - r()) * .2 : r() * 7, len: 22 + r() * r() * 72, col: pick(), lw: .25 + r() * .5 });
  return b;
}
function renderBurst(b, r) {
  const c = mk(BR * 2 * S, BR * 2 * S), g = c.getContext('2d'); g.scale(S, S);
  const x = BR, y = BR;
  radial(g, x, y, BR, [[0, b.col, .42], [.22, b.col, .2], [.55, b.col, .06], [1, b.col, 0]]);          // stands in for bloom
  for (const w of b.wedges) {                             // refracted shard wedges
    const gr = g.createRadialGradient(x, y, 0, x, y, w.len);
    gr.addColorStop(0, rgba(w.col, .34)); gr.addColorStop(1, rgba(w.col, 0));
    g.fillStyle = gr; g.beginPath(); g.moveTo(x, y);
    g.lineTo(x + Math.cos(w.a) * w.len, y + Math.sin(w.a) * w.len); g.lineTo(x + Math.cos(w.a + w.da) * w.len, y + Math.sin(w.a + w.da) * w.len);
    g.closePath(); g.fill();
  }
  for (const q of b.rays) {                               // crack rays, each over a wide faint underlay
    const ex = x + Math.cos(q.a) * q.len, ey = y + Math.sin(q.a) * q.len;
    fade(g, x, y, ex, ey, [[0, q.col, .2], [1, q.col, 0]], q.lw * 4.5);
    fade(g, x, y, ex, ey, [[0, mix(q.col, WHITE, .35), .75], [.14, q.col, .9], [1, q.col, 0]], q.lw);
  }
  for (let i = 0; i < 60; i++) {                          // sparks
    const a = r() * 7, d = 26 + r() * 62, rad = .25 + r() * r() * 1.1, col = r() < .35 ? WHITE : mix(b.col, WHITE, r() * .5);
    g.fillStyle = rgba(col, (.45 + r() * .55) * (1 - d / BR)); g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rad, 0, 7); g.fill();
    if (rad > .85) radial(g, x + Math.cos(a) * d, y + Math.sin(a) * d, rad * 5, [[0, col, .3], [1, col, 0]]);
  }
  return c;
}
function makePlate(pal, seed) {
  const r = rng(seed), pick = () => pal[(r() * pal.length) | 0];
  const P = { lines: null, bursts: [], throws: [], pal };
  const c = mk(PW, PH), g = c.getContext('2d'); g.scale(S, S);                 // cold glass: faint colour, hairline fractures, dust
  g.fillStyle = '#030408'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) { const col = pick(); radial(g, r() * W, r() * H, 70 + r() * 170, [[0, col, .03 + r() * .045], [1, col, 0]]); }
  for (let i = 0; i < 90; i++) {
    const x = r() * W, y = r() * H, a = r() * Math.PI, l0 = 40 + r() * 380, l1 = 40 + r() * 380;
    g.strokeStyle = rgba(pick(), .05 + r() * .17); g.lineWidth = .25 + r() * .4;
    g.beginPath(); g.moveTo(x - Math.cos(a) * l0, y - Math.sin(a) * l0); g.lineTo(x + Math.cos(a) * l1, y + Math.sin(a) * l1); g.stroke();
  }
  for (let i = 0; i < 420; i++) { g.fillStyle = rgba(r() < .3 ? WHITE : pick(), (.3 + r() * .5) * .5); g.beginPath(); g.arc(r() * W, r() * H, .2 + r() * r() * 1.05, 0, 7); g.fill(); }
  P.lines = c;
  KNOBS.forEach((k, i) => {
    const col = mix(k.color, pal[i % pal.length], .38), kp = () => r() < .65 ? col : pick();
    P.bursts.push({ img: renderBurst(burstGeo(r, col, kp), r), col, spin: r() < .5 ? -1 : 1 });
    const t = [];                                         // fractures this knob throws across the plate when it is up
    for (let n = 7 + (r() * 4 | 0); n--;) t.push({ a: r() * Math.PI, l0: 50 + r() * r() * 330, l1: 50 + r() * r() * 330, col: kp(), lw: .3 + r() * .5, k: .45 + r() * .55, ox: (r() - .5) * 7, oy: (r() - .5) * 7 });
    P.throws.push(t);
  });
  return P;
}

// ---------- wordmark sprites (baked) ----------
// Letterforms measured off 3x crops of the icon (icon/glass-icon-1024.png), in icon pixels,
// 780 x 136 outer. Each letter is a 32px band with squared ends; a 10px white tube runs along
// both edges of the band with a 12px red core between. Where the icon's tube does not close
// (top of the L, the L's foot into the A, the first S's lower-left end) the core runs to the end.
// Round 2, off 5x crops: the icon's glow is tight and saturated, with a crisp orange-red rim
// hugging the white and only a low haze beyond it, and its core is one flat colour. Side by side
// at the same size the tube reads 12 and the core 8; the L's two strands end in round tips; and each
// letter sits on top of the one before it, so the A's leg closes the L's foot.
const WM = { w: 780, h: 136, T: 32, tube: 12, pad: 170 };
function sLetter(x0, openFoot) {
  return { ends: [[x0 + 150, 16, 1], [x0 + 4, 120, -1]], path: (g, d) => {
    g.moveTo(x0 + 150 - d, 16); g.lineTo(x0 + 42, 16);
    g.arc(x0 + 42, 42, 26, -Math.PI / 2, Math.PI / 2, true);
    g.lineTo(x0 + 108, 68);
    g.arc(x0 + 108, 94, 26, -Math.PI / 2, Math.PI / 2, false);
    g.lineTo(x0 + 4 + (openFoot && d === WM.tube ? 0 : d), 120);
  } };
}
const WM_LETTERS = [
  { ends: [[180, 16, 1], [92, 76.5, -1]], path: (g, d) => {   // G: arm sits below centre, as in the icon
    g.moveTo(180 - d, 16); g.arcTo(16, 16, 16, 68, 39); g.arcTo(16, 120, 70, 120, 39);
    g.arcTo(164, 120, 164, 76.5, 20); g.arcTo(164, 76.5, 100, 76.5, 14); g.lineTo(92 + d, 76.5);
  } },
  { tips: [[199, 8], [219, 8]],                          // L: open top with a round tip on each strand, foot runs under the A
    path: (g, d) => { g.moveTo(209, 2 + (d === WM.tube ? 5 : d ? 6 : 0)); g.arcTo(209, 120, 240, 120, 8); g.lineTo(300, 120); } },
  { clip: true,                                          // A: legs run past the baseline and are cut flat
    path: (g, d) => { g.moveTo(297.8, 150); g.arcTo(379.5, -2, 461.2, 150, 21); g.lineTo(461.2, 150); },
    bar: (g, d) => { g.moveTo(338 + d * 1.4, 81); g.lineTo(421 - d * 1.4, 81); } },
  sLetter(470, true), sLetter(630, false)
];
function makeWordmark(hPx) {                              // hPx: letter height in canvas pixels
  const k = hPx / WM.h, pad = Math.round(WM.pad * k), w = Math.round(WM.w * k), cw = w + pad * 2, ch = Math.round(hPx) + pad * 2;
  // one pass over every letter: d insets the ends, core marks the red band between the tubes
  const pass = (o, only) => {
    const c = mk(cw, ch), ctx = c.getContext('2d'), grow = o.grow || 0;
    for (const L of only ? [only] : WM_LETTERS) {
      ctx.save(); ctx.translate(pad, pad); ctx.scale(k, k); ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
      if (L.clip) { ctx.beginPath(); ctx.rect(-60, -grow, WM.w + 120, WM.h - (o.core ? WM.tube : 0) + grow * 2); ctx.clip(); }
      ctx.strokeStyle = ctx.fillStyle = o.color;
      ctx.beginPath(); L.path(ctx, o.d); ctx.lineWidth = o.w; ctx.stroke();
      if (o.caps && L.ends) for (const [ex, ey, dir] of L.ends) {   // the white band stops short, then gets a small-radius end cap
        ctx.beginPath(); ctx.roundRect(dir > 0 ? ex - 13 : ex, ey - WM.T / 2, 13, WM.T, dir > 0 ? [0, 7, 7, 0] : [7, 0, 0, 7]); ctx.fill();
      }
      if (o.caps && L.tips) for (const [tx, ty] of L.tips) { ctx.beginPath(); ctx.arc(tx, ty, WM.tube / 2, 0, 7); ctx.fill(); }
      if (L.bar) { ctx.beginPath(); L.bar(ctx, o.d); ctx.lineWidth = o.bar; ctx.stroke(); }
      ctx.restore();
    }
    return c;
  };
  const band = { d: 6, w: WM.T, caps: true, bar: 20 }, core = { d: WM.tube, w: WM.T - WM.tube * 2, core: true, bar: 4 };
  const out = { k, pad, w, glow: mk(cw, ch), tube: mk(cw, ch), off: mk(cw, ch) };

  // glow, widest first: low haze, body, tight saturated red, then the crisp rim against the white
  const body = pass({ d: 0, w: WM.T + 6, grow: 6, bar: 26, color: '#000' });
  let g = out.glow.getContext('2d');
  softImg(g, body, 54 * k, .3, '#ff1e00'); softImg(g, body, 25 * k, .5, '#ff2200');
  softImg(g, body, 10 * k, .92, '#ff2600'); softImg(g, body, 4.5 * k, .9, '#ff3606');
  softImg(g, pass({ d: 0, w: WM.T + 2, grow: 2, bar: 22, color: '#000' }), 1.2 * k, 1, '#ff3c08');

  // tube: warm white glass around one flat core, as the icon has it
  g = out.tube.getContext('2d');
  for (const L of WM_LETTERS) { g.drawImage(pass({ ...band, color: '#fff6ec' }, L), 0, 0); g.drawImage(pass({ ...core, color: '#fb3c0a' }, L), 0, 0); }

  // unlit: what the sign looks like in the frames where the flicker drops it
  g = out.off.getContext('2d');
  g.drawImage(pass({ ...band, color: 'rgba(172,150,150,.36)' }), 0, 0);
  for (const L of WM_LETTERS) g.drawImage(pass({ ...core, color: 'rgb(38,8,6)' }, L), 0, 0);
  return out;
}
let wm = null;

// ---------- knob cap sprite (baked): a dark disc and one fine ring, the burst does the rest ----------
const CP = 14;                                           // room around the cap for its shadow
function makeCap(R) {
  const c = mk((R + CP) * 2 * S, (R + CP) * 2 * S), g = c.getContext('2d');
  g.scale(S, S); g.translate(R + CP, R + CP);
  const disc = r => { g.beginPath(); g.arc(0, 0, r, 0, 7); };
  g.save(); g.shadowColor = 'rgba(0,0,0,.95)'; g.shadowBlur = 6 * 2 * S; g.shadowOffsetY = 4 * S; g.fillStyle = '#000'; disc(R - 1); g.fill(); g.restore();
  g.fillStyle = '#06070a'; disc(R); g.fill();
  const ring = g.createLinearGradient(0, -R, 0, R); ring.addColorStop(0, 'rgba(255,255,255,.4)'); ring.addColorStop(1, 'rgba(255,255,255,.14)');
  disc(R - .6); g.strokeStyle = ring; g.lineWidth = 1; g.stroke();
  return c;
}
let cap = null;

// ---------- SHATTER button (baked): one thin tube in the wordmark's red: unlit, glow, lit ----------
const SPAD = 28, SHW = 104, SHH = 32;
function shCanvas() { const c = mk((SHW + SPAD) * S, (SHH + SPAD) * S), g = c.getContext('2d'); g.scale(S, S); g.translate(SPAD / 2, SPAD / 2); return [c, g]; }
function makeNeon() {
  const tubeOf = (color, w) => { const [c, g] = shCanvas(); g.beginPath(); g.roundRect(2, 2, SHW - 4, SHH - 4, (SHH - 4) / 2); g.strokeStyle = color; g.lineWidth = w; g.stroke(); return c; };
  const body = tubeOf('#000', 3), glow = mk(body.width, body.height), g = glow.getContext('2d');
  softImg(g, body, 6 * S, .45, '#ff1e00'); softImg(g, body, 2.6 * S, .9, '#ff2600'); softImg(g, body, .8 * S, 1, '#ff3c08');
  return { glow, tube: tubeOf('#fff3e6', 1.5), off: tubeOf('rgba(172,150,150,.42)', 1.5) };
}
let neon = null;

// ---------- state ----------
const KNOBS = [
  { label: 'REFLECT', macro: 0, color: [237, 94, 69] },
  { label: 'VERB',    macro: 7, color: [242, 138, 77] },
  { label: 'DELAY',   macro: 1, color: [252, 196, 107] },
  { label: 'ECHO %',  macro: 2, color: [94, 212, 201] },
  { label: 'ECHO T',  macro: 3, color: [71, 184, 217] },
  { label: 'WAVY',    macro: 4, color: [102, 148, 235] },
  { label: 'WOBBLE',  macro: 5, color: [163, 87, 201] },
  { label: 'COMP',    macro: 6, color: [219, 87, 158] }
];
const STOCK = [
  { name: 'MIDNIGHT', stock: true, vals: [82, 68, 69, 65, 64, 64, 0, 41], accent: [77, 140, 242],
    pal: [[60, 110, 255], [90, 80, 240], [40, 170, 255], [130, 110, 255], [90, 200, 255]], seed: 211 },
  { name: 'ANGELS', stock: true, vals: [127, 75.2, 49.96, 52.93, 78.83, 53.06, 43, 97.3], accent: [209, 143, 245],
    pal: [[255, 130, 200], [255, 200, 120], [200, 150, 255], [255, 170, 90], [255, 80, 150]], seed: 322 },
  { name: 'GHOSTS', stock: true, vals: [45.94, 16.37, 80, 66.45, 107.79, 35, 110, 80.56], accent: [102, 219, 153],
    pal: [[70, 240, 160], [50, 210, 200], [140, 255, 170], [40, 180, 220], [120, 255, 210]], seed: 433 }
];
const ICON_PAL = [[255, 60, 40], [255, 60, 40], [255, 140, 50], [255, 200, 90], [60, 220, 230], [70, 120, 255], [240, 70, 170], [150, 90, 255]];
const palFromHue = h => [hsl(h, 1, .6), hsl(h + 28, 1, .62), hsl(h + 150, .95, .6), hsl(h + 185, 1, .6), hsl(h + 215, .9, .65), hsl(h + 320, 1, .62)];
const USER_SEEDS = [19, 84, 64, 339, 142];                 // the "five" state: five SHATTERs somebody kept
const NAME_MAX = 9, HOLD_MS = 700;
// macro index order, 0..127, seeded from the device screenshot
let vals = [20, 22, 90, 42, 30, 6, 4, 51].map(p => p * 1.27);
let glass = { pal: ICON_PAL, seed: 108 }, plate = null, loaded = null;   // loaded: the preset whose knobs are still untouched
let energy = 0, drag = null, shT = -1, sp = 1;
const NOHOVER = { knob: -1, slot: -1, zone: '', shatter: false, row: -1, foot: -1 };
let hover = NOHOVER;
// version a: bank + slotRef (three face slots, each pointing into the bank)
// version b: bslot (four slots, each holding its own preset or nothing)
// version c: bank (three stock on the face, the rest behind the pager at stop pg; one past the last is the save stop)
let version = 'a', saved = 0, bank = [], slotRef = [], bslot = [], pg = 0;
let list = null, edit = null, hold = null, barDrag = null, blink = 0, wheelAcc = 0;

const A0 = Math.PI * .75, SWEEP = Math.PI * 1.5, UI = '"Avenir Next", "Helvetica Neue", Arial';
const M = 20, KY = 106, KR = 22, LABEL_Y = 152, WMX = 16, WMY = 28, WMH = 38;
const kx = i => M + (W - M * 2) / 8 * (i + .5);
const PILL = { h: 26, y: 14 }, TY = PILL.y + PILL.h * .42, LY = PILL.y + PILL.h * .8, DIM = [150, 157, 172];
function layout() {                                       // the header's slots, left to right; all end 12 px from the right edge
  if (version === 'b') return [0, 1, 2, 3].map(i => ({ x: 385 + i * 78, w: 74 }));
  if (version === 'c') return [0, 1, 2].map(i => ({ x: 387 + i * 70, w: 66 })).concat({ x: 597, w: 96, pager: true });
  return [0, 1, 2].map(i => ({ x: 463 + i * 78, w: 74 }));
}
const wmRight = () => WMX + WM.w / WM.h * WMH;
const shardRect = () => { const x0 = wmRight() + 14, x1 = layout()[0].x - 14; return [x0 + (x1 - x0 - SHW) / 2, PILL.y + PILL.h / 2 - SHH / 2, SHW, SHH]; };
const LIST = { w: 168, row: 17, max: 6, foot: 20, y: PILL.y + PILL.h + 2 };
function listRect() {
  const rows = Math.min(bank.length, LIST.max);
  return { x: Math.min(layout()[list.slot].x, W - 8 - LIST.w), y: LIST.y, w: LIST.w, rows, h: rows * LIST.row + LIST.foot + 2 };
}
const maxScroll = () => Math.max(0, bank.length - LIST.max);
function editRect() { const L = layout()[edit.slot]; return L.pager ? [L.x + 16, PILL.y + 2, L.w - 32, 15] : [L.x + 1, PILL.y + 2, L.w - 2, 15]; }

// ---------- the bank ----------
// A saved preset keeps the knob values and the glass it was saved on (palette and seed), so a
// SHATTER comes back the same. Its accent is the first palette colour.
const plates = {};                                       // plates of saved presets, by seed; a bare SHATTER plate is never kept
const clone = P => ({ ...P, vals: P.vals.slice() });
function glassFrom(r) { const pal = palFromHue(r() * 360), seed = (r() * 1e9) | 0; return { pal, seed, vals: KNOBS.map(() => r() * 127) }; }
function userPreset(n) { const G = glassFrom(rng(USER_SEEDS[n - 1])); return { name: 'USER ' + n, vals: G.vals, accent: G.pal[0], pal: G.pal, seed: G.seed }; }
function setGlass(pal, seed) { glass = { pal, seed }; plate = plates[seed] || makePlate(pal, seed); }
function load(P) { if (!P) return; vals = P.vals.slice(); setGlass(P.pal, P.seed); plates[P.seed] = plate; loaded = P; }
function snapshot(name) { plates[glass.seed] = plate; return { name, vals: vals.slice(), accent: glass.pal[0], pal: glass.pal, seed: glass.seed }; }
function nextUser() { for (let n = 1; ; n++) if (!bank.some(P => P.name === 'USER ' + n)) return 'USER ' + n; }

    list.scroll = Math.max(0, Math.min(maxScroll(), Math.round(barDrag.s0 + (e.clientY - barDrag.y) * barDrag.k / per))); kick(); return;
  }
  if (!drag) return;
  const m = KNOBS[drag.knob].macro;
  vals[m] = Math.max(0, Math.min(127, vals[m] + (drag.y - e.clientY) * .7)); drag.y = e.clientY;
  loaded = null; kick();
});
window.addEventListener('mouseup', e => {
  if (hold) { if (!hold.done) load(bslot[hold.slot]); hold = null; }   // let go early: a tap, which loads
  barDrag = null;
  if (drag) { const c = e.target === zoom || e.target === actual ? e.target : null, b = c && c.getBoundingClientRect();
    const h = c ? hit((e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height) : {};
    hover = { ...NOHOVER, knob: h.knob ?? -1 }; }
  drag = null; kick();
});
window.addEventListener('keydown', e => {
  if (edit) {                                             // typed, capitals, nine characters; Enter keeps it, Esc leaves the name as it was
    if (e.key === 'Enter') closeEdit(true);
    else if (e.key === 'Escape') closeEdit();
    else if (e.key === 'Backspace') { edit.text = edit.sel ? '' : edit.text.slice(0, -1); edit.sel = false; }
    else if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
      if (edit.sel) { edit.text = ''; edit.sel = false; }
      if (edit.text.length < NAME_MAX) edit.text += e.key.toUpperCase();
    } else return;
    if (edit) edit.t0 = performance.now();
    e.preventDefault(); kick();
  } else if (list && e.key === 'Escape') { list = null; kick(); }
});

const VERSIONS = [
  { key: 'a', chip: 'A: one bank, three slots', cap: 'Click a name to load it. Hover a slot and click the caret at the end of its colour line to open the bank. Picking a row puts that preset in the slot and loads it. SAVE NEW keeps the current knobs and glass as a new preset. RENAME and DELETE act on the preset this slot holds, and stay dim on a stock one. DELETE turns to CONFIRM and needs a second click; clicking anywhere else calls it off. The same bank sits behind all three slots.' },
  { key: 'b', chip: 'B: four slots', cap: 'Tap a slot to load it. Hold it for 0.7 seconds to save the current knobs and glass into it (shift-click does the same). Double-click a name to rename it. Option-click puts a slot back to how it shipped. The four slots are the whole bank, so a fifth save has to replace one.' },
  { key: 'c', chip: 'C: stock and a pager', cap: 'The three stock presets stay where they are. The chevrons step through your own presets and load each one as you land on it. One step past the last is SAVE NEW: click it to keep the current knobs and glass. Double-click a name to rename it, option-click it to delete it.' }
];
const NAMING = ' Naming: type, Enter keeps it, Esc leaves the name as it was. Capitals, nine characters.';

(function boot() {
  wm = makeWordmark(WMH * S); cap = makeCap(KR); neon = makeNeon();
  // stills: ?v=a|b|c, ?saved=5, ?open=0..2 (version a's list), ?preset=<slot>, ?shatter=<seed>, ?hover=<knob>
  const qs = new URLSearchParams(location.search);
  if (VERSIONS.some(v => v.key === qs.get('v'))) version = qs.get('v');
  saved = qs.get('saved') === '5' ? 5 : 0;
  const caption = () => { document.getElementById('cap').textContent = VERSIONS.find(v => v.key === version).cap + NAMING; };
  const chips = (id, names, at, set) => names.forEach((n, i) => {
    const b = document.createElement('button'); b.textContent = n; b.className = at === i ? 'on' : '';
    b.onclick = () => { set(i); reset(); caption(); for (const o of b.parentNode.querySelectorAll('button')) o.className = o === b ? 'on' : ''; kick(); };
    document.getElementById(id).appendChild(b);
  });
  chips('pickV', VERSIONS.map(v => v.chip), VERSIONS.findIndex(v => v.key === version), i => version = VERSIONS[i].key);
  chips('pickSaved', ['None', 'Five'], saved ? 1 : 0, i => saved = i * 5);
  reset(); caption();
  if (qs.get('shatter')) shatter(+qs.get('shatter')); else setGlass(ICON_PAL, 108);
  const q = qs.get('preset'), o = qs.get('open');
  if (q !== null) load((version === 'a' ? slotRef : version === 'b' ? bslot : bank)[+q]);
  if (version === 'a' && o !== null && slotRef[+o]) list = { slot: +o, scroll: 0 };
  if (qs.get('hover')) hover = { ...NOHOVER, knob: +qs.get('hover') };
  energy = target();
  frame();
  // read by the Playwright check: the state as names, and where things sit in face pixels
  window.glassMock = {
    state: () => ({ version, saved, bank: bank.map(P => P.name), slots: (version === 'b' ? bslot : version === 'a' ? slotRef : bank.slice(0, 3)).map(P => P && P.name),
      pager: version === 'c' ? (bank[3 + pg] ? bank[3 + pg].name : 'SAVE NEW') : null, loaded: loaded && loaded.name, seed: glass.seed,
      list: list && { ...list, rect: listRect() }, edit: edit && { text: edit.text, sel: edit.sel, rect: editRect() }, vals: vals.map(v => Math.round(v)) }),
    layout, shardRect, knob: i => [kx(i), KY]
  };
})();
</script>
